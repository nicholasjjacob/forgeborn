<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14111d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Forgeborn</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" as="image" href="./loading-heroes.webp" />
    <link rel="icon" type="image/png" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="A top-down action idle RPG: fight, forge weapons, and push through new areas." />
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Two layouts: "pc" for wide windows (Chrome on a laptop or desktop, the Windows app) and
      // the phone layout for everything else. Set before the first paint so nothing jumps.
      (function () {
        var q = matchMedia('(min-width: 900px) and (min-aspect-ratio: 5/4)');
        var set = function () { document.documentElement.classList.toggle('pc', q.matches); };
        set();
        q.addEventListener('change', set);
      })();
    </script>
    <style>
      /* Loading screen: styled here (not in style.css) so it shows on the very first paint. */
      #loading {
        position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        padding: 24px; background: radial-gradient(ellipse at 50% 38%, #2c3a8c, #14193f 70%); color: #fff;
        font-family: 'Lilita One', 'Arial Black', system-ui, sans-serif; transition: opacity 0.45s ease;
      }
      #loading.gone { opacity: 0; pointer-events: none; }
      /* The nine heroes in a lineup (a pre-rendered picture, so it shows before any code loads),
         with the title tucked up under their feet. Sizes follow the screen. */
      .ld-heroes { position: relative; width: min(94vw, 880px, calc(62dvh * 3.44)); aspect-ratio: 1630 / 463; }
      .ld-heroes::before { content: ''; position: absolute; inset: -12% -4% -22%; background: radial-gradient(closest-side, #6f8cff50, transparent); pointer-events: none; }
      .ld-heroes img { position: relative; display: block; width: 100%; height: 100%; opacity: 0; transform: translateY(8px); transition: opacity 0.5s ease, transform 0.5s ease; }
      .ld-heroes img.in { opacity: 1; transform: none; }
      #loading h1 { margin: -2px 0 0; font-size: clamp(40px, 9vw, 72px); font-weight: 400; letter-spacing: 0.04em; line-height: 1; text-shadow: 0 4px 0 #0a1035, 0 0 22px #6f8cff88; }
      .ld-bar { position: relative; width: min(300px, 74vw); height: 18px; border-radius: 10px; overflow: hidden; background: #0a1035; box-shadow: 0 0 0 3px #8a5a2b, 0 4px 0 3px #4a2c12, inset 0 2px 0 #0008; }
      .ld-fill { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0.03); background: linear-gradient(#ffe85a, #ffb81c 60%, #e8901c); transition: transform 0.35s ease-out; }
      .ld-text { min-height: 1.2em; font-family: Fredoka, system-ui, sans-serif; font-weight: 600; font-size: 14px; color: #a9b8ee; }
    </style>
  </head>
  <body>
    <div id="loading" role="progressbar" aria-label="Loading Forgeborn">
      <div class="ld-heroes"><img src="./loading-heroes.webp" alt="" onload="this.classList.add('in')" /></div>
      <h1>Forgeborn</h1>
      <div class="ld-bar"><div class="ld-fill"></div></div>
      <div class="ld-text">Loading…</div>
    </div>
    <main id="app">
      <p id="hint" class="hint">Drag to move · tap Auto to let the hero hunt on their own</p>
      <section id="battle" aria-label="Battlefield">
        <div id="canvas-host"></div>
        <div id="vignette" aria-hidden="true"></div>
        <header id="topbar">
          <div class="purse">
            <div class="gold" aria-label="Gold"><span class="coin" aria-hidden="true"></span><span id="gold-label">0</span></div>
            <div class="shards" aria-label="Shards"><span class="gem" aria-hidden="true"></span><span id="shard-label">0</span></div>
            <div class="embers" aria-label="Embers"><span class="ember" aria-hidden="true"></span><span id="ember-label">0</span></div>
            <div class="gems" aria-label="Gems"><span class="jewel" aria-hidden="true"></span><span id="gem-label">0</span></div>
            <nav class="side-icons" aria-label="Missions">
              <button type="button" id="side-map" class="side-btn" aria-label="World map"><span class="side-ico">🗺️</span><span class="side-lbl">Map</span><b class="dot" hidden>!</b></button>
              <button type="button" id="side-missions" class="side-btn" aria-label="Missions"><span class="side-ico">📅</span><span class="side-lbl">Missions</span><b class="dot" hidden></b></button>
              <button type="button" id="side-journey" class="side-btn" aria-label="7-Day Journey"><span class="side-ico">🎁</span><span class="side-lbl">7-Day</span><b class="dot" hidden></b></button>
              <button type="button" id="side-codex" class="side-btn" aria-label="Monster Codex"><span class="side-ico">📖</span><span class="side-lbl">Codex</span><b class="dot" hidden></b></button>
              <button type="button" id="side-bag" class="side-btn" aria-label="Bag"><span class="side-ico">🎒</span><span class="side-lbl">Bag</span></button>
              <button type="button" id="side-heroes" class="side-btn" aria-label="Heroes"><span class="side-ico">🛡️</span><span class="side-lbl">Heroes</span></button>
            </nav>
          </div>
          <div class="stage-info">
            <span id="stage-label">Meadow Outskirts</span>
            <span id="area-label">Greenfield Meadow</span>
            <div id="progress" aria-hidden="true"><div id="progress-fill"></div><span id="progress-text"></span></div>
            <button type="button" id="level-chip" class="level-chip" aria-label="Hero level and rewards">
              <span id="level-num">Lv 1</span><span class="xp-bar"><span id="xp-fill"></span></span><b class="dot" id="level-dot" hidden></b>
            </button>
          </div>
          <div class="chips">
            <button id="auto-btn" class="chip" type="button" title="Auto-hunt when you're not steering">Auto</button>
            <button id="settings-btn" class="chip icon-chip" type="button" aria-label="Settings" title="Settings"><span class="cog">⚙</span><span class="badge" id="reforge-badge"></span></button>
          </div>
        </header>
        <div id="toast" role="status" aria-live="polite"></div>
      </section>

      <!-- Menu pages open over the battlefield from the bottom bar (Reforge opens from Settings). -->
      <section id="panel" hidden aria-labelledby="page-title">
        <div class="page-top">
          <h2 id="page-title" class="ribbon-text">Upgrades</h2>
          <button type="button" id="page-close" class="sheet-x" aria-label="Close">✕</button>
        </div>
        <div class="tab-page" data-page="upgrades" role="tabpanel"><div class="page-fit">
          <div class="page-head">
            <span class="page-note">Hold a button to keep buying</span>
            <div class="buy-modes" role="group" aria-label="Buy amount">
              <button type="button" data-buy-mode="1">x1</button>
              <button type="button" data-buy-mode="10">x10</button>
              <button type="button" data-buy-mode="max">Max</button>
            </div>
          </div>
          <ul id="upgrade-list"></ul>
        </div></div>
        <div class="tab-page" data-page="quests" role="tabpanel" hidden>
          <div id="quests-root" class="page-pad"></div>
        </div>
        <div class="tab-page" data-page="reforge" role="tabpanel" hidden>
          <div id="reforge-root" class="page-pad"></div>
        </div>
        <div class="tab-page" data-page="forge" role="tabpanel" hidden>
          <div id="forge-root"></div>
        </div>
      </section>
      <nav id="dock" aria-label="Menu">
        <button type="button" data-tab="upgrades" aria-pressed="false"><i class="dock-ico" data-ico="up"></i><span class="dock-lbl">Upgrades</span></button>
        <button type="button" data-tab="forge" aria-pressed="false"><i class="dock-ico" data-ico="anvil"></i><span class="dock-lbl">Forge</span><span class="badge" id="forge-badge"></span></button>
        <button type="button" data-tab="quests" aria-pressed="false"><i class="dock-ico" data-ico="scroll"></i><span class="dock-lbl">Quests</span><span class="badge" id="quests-badge"></span></button>
      </nav>
    </main>
    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
      <div class="modal-card">
        <h2 id="modal-title">Welcome back!</h2>
        <p id="modal-away"></p>
        <div class="rewards">
          <div class="reward"><span class="coin" aria-hidden="true"></span><b id="modal-gold"></b><span>gold</span></div>
          <div class="reward" id="modal-shards-row"><span class="gem" aria-hidden="true"></span><b id="modal-shards"></b><span>shards</span></div>
        </div>
        <p class="modal-note" id="modal-note"></p>
        <button type="button" class="btn primary" id="modal-ok">Collect</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
